<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none" role="img" aria-labelledby="irTitle">
  <title id="irTitle">IREG-IT sanitized backend delivery architecture</title>
  <rect width="720" height="380" fill="#f7f5f2"/>
