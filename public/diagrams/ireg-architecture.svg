  <text x="595" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#57534e">GitHub Actions</text>
  <text x="595" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#57534e">Ubuntu / GCP</text>
  <text x="595" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#57534e">k6  |  Grafana</text>
  <text x="595" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#57534e">Mockito  |  Playwright</text>

