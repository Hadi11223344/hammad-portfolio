  <text x="275" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">JWT  |  IP allowlist</text>
  <text x="275" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">Profiles</text>

  <path d="M350 128 H390" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="390" y="100" width="120" height="56" rx="4" fill="#e7e5e4" stroke="#44403c" stroke-width="1.2"/>
  <text x="450" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">PostgreSQL</text>
  <text x="450" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">JPA</text>

