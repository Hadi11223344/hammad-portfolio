<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none" role="img" aria-labelledby="scTitle">
  <title id="scTitle">SmartCare safety sandwich architecture</title>
  <rect width="720" height="380" fill="#f7f5f2"/>
  <text x="36" y="36" font-family="system-ui,sans-serif" font-size="13" fill="#57534e" letter-spacing="0.08em">SMARTCARE  |  SAFETY PIPELINE</text>

  <rect x="40" y="90" width="100" height="50" rx="4" fill="#e7e5e4" stroke="#44403c" stroke-width="1.2"/>
  <text x="90" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">Request</text>

  <path d="M140 115 H175" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="175" y="80" width="120" height="70" rx="4" fill="#d6d3d1" stroke="#292524" stroke-width="1.5"/>
  <text x="235" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">Pre-safety</text>
  <text x="235" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">PII  |  crisis</text>

  <path d="M295 115 H330" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="330" y="70" width="130" height="90" rx="4" fill="#e7e5e4" stroke="#44403c" stroke-width="1.2"/>
  <text x="395" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">Context + RAG</text>
  <text x="395" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">Patient + docs</text>
  <text x="395" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">pgvector</text>

  <path d="M460 115 H495" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="495" y="90" width="100" height="50" rx="4" fill="#e7e5e4" stroke="#44403c" stroke-width="1.2"/>
  <text x="545" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">LLM</text>
  <text x="545" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">Groq</text>

  <path d="M545 140 V185" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="485" y="185" width="120" height="60" rx="4" fill="#d6d3d1" stroke="#292524" stroke-width="1.5"/>
  <text x="545" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">Post-safety</text>
  <text x="545" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#57534e">Second pass</text>

  <path d="M485 215 H400" stroke="#78716c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="300" y="190" width="100" height="50" rx="4" fill="#fafaf9" stroke="#78716c" stroke-width="1"/>
  <text x="350" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1c1917">Response</text>

  <text x="36" y="300" font-family="system-ui,sans-serif" font-size="11" fill="#78716c">Pre-check - retrieve - generate - post-check  |  not medical-grade claims</text>
  <text x="36" y="330" font-family="system-ui,sans-serif" font-size="11" fill="#a8a29e">Emergency / crisis paths can short-circuit generation</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#78716c" stroke-width="1.2"/>
    </marker>
  </defs>
</svg>
